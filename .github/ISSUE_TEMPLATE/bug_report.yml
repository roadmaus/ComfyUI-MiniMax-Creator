name: Bug report
description: Something broke — a render fails, the UI misbehaves, an error you can reproduce.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. This is a one-person project, so a report I can reproduce gets fixed and a report I have to guess at waits. Three things help most:
        - If the node **refused** the render with a message naming a field and a folder, that is a missing weight file, not a bug — see the [FAQ](https://github.com/roadmaus/ComfyUI-Continuity/blob/main/docs/faq.md) and the model tables in [docs/models.md](https://github.com/roadmaus/ComfyUI-Continuity/blob/main/docs/models.md).
        - Questions and feature ideas go to [Discussions](https://github.com/roadmaus/ComfyUI-Continuity/discussions); one bug per issue here.
        - Fill in the environment block even if it feels irrelevant. Nearly every report I can't act on is missing exactly that.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead. Paste the exact text of any error or refusal.
      placeholder: |
        1. Attached @img-1, typed "...", pressed Run
        2. Expected a clip
        3. Got: "..."
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: The ComfyUI terminal around the failure — the full traceback if there is one. For UI problems, also the browser DevTools console (F12).
      render: text

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        ComfyUI version is printed at startup or shown in Manager. The node version is in `pyproject.toml`, or `git log -1 --oneline` in the node's folder. The model lines matter for render bugs; filenames are enough — they carry quantization, variant and source.
      value: |
        - ComfyUI version / commit:
        - Continuity version / commit:
        - Installed via: (git clone / ComfyUI Manager / registry)
        - OS, GPU + VRAM:
        - Model family: (MiniMax H3 / LTX 2.5 / Krea 2 / Ideogram 4.0 / Qwen Image Edit / Flux 2 Klein)
        - Checkpoint / text encoder / VAE (render bugs):
        - GGUF, LoRAs, turbo, accelerator pill (if any):
        - UI language (UI bugs): 
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: Workflow / prompt
      description: Drag the workflow JSON here (Workflow → Export), or paste the prompt and say what was attached (images/videos/audio, scopes, trims). This is what lets me reproduce instead of guess.
